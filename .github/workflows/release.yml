name: Release Yunqiao Codex Bridge

on:
  push:
    branches:
      - main
    paths:
      - "config.go"
      - "RELEASE_NOTES_v*.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path config.go -Pattern 'appVersion\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "appVersion not found" }
          $version = $match.Matches.Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $exists = @($releases | Where-Object { $_.tagName -eq "v${{ steps.version.outputs.version }}" }).Count -gt 0
          if ($exists) { "exists=true" >> $env:GITHUB_OUTPUT }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
      - name: Build frontend
        if: steps.existing.outputs.exists != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
      - name: Resolve Go dependencies and test
        if: steps.existing.outputs.exists != 'true'
        run: |
          go mod tidy
          go test ./...
      - name: Install Wails build tools
        if: steps.existing.outputs.exists != 'true'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0
          goversioninfo -64 -o versioninfo_windows_amd64.syso
      - name: Build Windows x64 client
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          wails build -clean -nopackage -platform windows/amd64 -webview2 download -trimpath -ldflags "-s -w -H=windowsgui" -o YunqiaoCodexBridge.exe
          $exe = (Resolve-Path build/bin/YunqiaoCodexBridge.exe).Path
          $product = (Get-Item $exe).VersionInfo
          if ($product.ProductVersion -notlike "${{ steps.version.outputs.version }}*") { throw "Version resource mismatch: $($product.ProductVersion)" }
      - name: Microsoft Defender scan
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $exe = (Resolve-Path build/bin/YunqiaoCodexBridge.exe).Path
          Update-MpSignature
          Start-MpScan -ScanType CustomScan -ScanPath $exe
          $detections = Get-MpThreatDetection | Where-Object { $_.Resources -match [regex]::Escape($exe) }
          if ($detections) {
            $detections | Format-List *
            throw 'Microsoft Defender reported a detection. Release withheld.'
          }
      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Resolve-Path build/bin/YunqiaoCodexBridge.exe).Path
          $sum = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  YunqiaoCodexBridge.exe" | Set-Content -Encoding utf8 build/bin/YunqiaoCodexBridge.exe.sha256
          gh release create "v${{ steps.version.outputs.version }}" $exe build/bin/YunqiaoCodexBridge.exe.sha256 --target "$env:GITHUB_SHA" --title "云桥（熙楠）v${{ steps.version.outputs.version }}" --notes-file "RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
