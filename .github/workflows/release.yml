name: Release Windows Bridge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./...
      - name: Build Windows x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -H=windowsgui" -o YunqiaoCodexBridge.exe .
      - name: Create checksum
        run: sha256sum YunqiaoCodexBridge.exe > YunqiaoCodexBridge.exe.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" YunqiaoCodexBridge.exe YunqiaoCodexBridge.exe.sha256 --generate-notes --title "Yunqiao Codex Bridge ${GITHUB_REF_NAME}"
