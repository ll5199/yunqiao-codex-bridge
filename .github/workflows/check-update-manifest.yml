name: Check Yunqiao update manifest
on:
  push:
    paths:
      - .github/workflows/check-update-manifest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect live update manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 30 --output latest.json --write-out 'HTTP %{http_code}\nFinal URL %{url_effective}\n' https://index.velyn65.com/download/latest.json
          curl --silent --show-error --location --head --max-time 30 --output /dev/null --write-out 'v1.6.0 asset HTTP %{http_code} (%{size_download} bytes)\\n' https://index.velyn65.com/download/YunqiaoCodexBridge-v1.6.0.exe
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("latest.json").read_text())
          print(json.dumps({key: manifest.get(key) for key in ("version", "download_url", "sha256", "notes")}, ensure_ascii=False, indent=2))
          PY
