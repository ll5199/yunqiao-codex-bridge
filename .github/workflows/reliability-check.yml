name: Validate client reliability
on:
  push:
    branches: ['release/1.6.3']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build
      - name: Test and vet
        shell: pwsh
        run: |
          go mod verify
          $unformatted = gofmt -l .
          if ($unformatted) { Write-Error "gofmt needed: $unformatted"; exit 1 }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -unsafeptr=false ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o build-check.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
